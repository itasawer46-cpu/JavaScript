<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: cursive;

        }
        body{
            background-color: palevioletred;
        }
.List_Item{
    list-style: none;
    display: flex;
    align-items: center;
    gap:10vw;
    border:2px solid purple;
    padding: 10px;
    border-radius: 10px;
    width:20vw;
    position: relative;
    color:white;
    font-size: 20px;
    margin: 10px 0px;
    overflow: hidden;
}
.image{
    position: absolute;
    right:10px;
}
.container{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
.unorder_list{
    display: flex;
    flex-direction: column;
}
#input{
    padding: 10px;
    border-radius: 10px;
    width:15vw;
}
#input:focus{
    outline: none;
}
#btn{
    padding: 5px;
    color:white;
    background-color: black;
    border:none;
    border-radius: 5px;
    transition: all 0.5s;
}
#btn:hover{
    background-color:white;
    color:black;
}
#btn:active{
    transform: scale(0.8);
}
.image:active{
    transform: scale(0.6);
}
    </style>
</head>
<body>
    <div class="container">
        <div>
    <input type="text" placeholder="Enter List_Item" id="input">
<button id="btn">Add Item</button>
</div>
    <ul class="unorder_list">


    </ul>
    </div>
    <script>
let input = document.querySelector("#input");
let button = document.querySelector("#btn");
let unorder_list = document.querySelector(".unorder_list");
button.addEventListener("click",()=>{
    if(input.value==""){
        input.placeholder="Please Enter Some Task";
        input.placeholder.style.Color = "red";
    }
    let input_value = input.value;
    let li = document.createElement("li");
    li.classList.add("List_Item");
    li.innerHTML = input_value;
let crossimage = document.createElement("img");
    crossimage.src = "cross.svg";
    crossimage.classList.add("image");
    li.append(crossimage);
    unorder_list.append(li);
    crossimage.addEventListener("click",()=>{
    li.remove();
    })
    input.value ="";
})
    </script>
</body>
</html>
